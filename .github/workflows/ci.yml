name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests scripts
      - name: Tests
        run: pytest -q
      - name: Offline evaluations (no API key needed)
        run: |
          python -m scripts.eval_extraction --offline
          python -m scripts.eval_recommend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kaampramaan .
